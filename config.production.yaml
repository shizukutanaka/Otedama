# Otedama Production Configuration
# This is the recommended configuration for production environments

# Mining Configuration
mining:
  algorithm: sha256d  # Most profitable algorithm will be auto-selected if auto_select is true
  auto_select: true   # Automatically switch to most profitable algorithm
  auto_start: true    # Start mining automatically on launch
  
  # CPU Configuration
  cpu:
    enabled: true
    threads: 0        # 0 = auto-detect optimal thread count
    affinity: []      # Empty = auto-assign CPU affinity
    priority: high    # low, normal, high, realtime
    huge_pages: true  # Enable huge pages for better performance
  
  # GPU Configuration
  gpu:
    enabled: true
    devices: []       # Empty = use all available GPUs
    intensity: 22     # 1-30, higher = more GPU usage
    temperature_limit: 83  # Celsius
    power_limit: 0    # Watts, 0 = no limit
    memory_clock: 0   # MHz, 0 = default
    core_clock: 0     # MHz, 0 = default
  
  # ASIC Configuration
  asic:
    enabled: false
    devices: []       # Serial ports for ASIC devices
    frequency: 650    # MHz
  
  # Optimization
  optimization:
    power_mode: balanced     # efficiency, balanced, performance, turbo
    auto_tuning: true        # Enable automatic performance tuning
    tuning_interval: 300     # Seconds between auto-tuning
    target_efficiency: 0.95  # Target efficiency ratio

# Stratum Configuration
stratum:
  enabled: true
  version: 2           # Stratum version (1 or 2)
  
  # Mining Pools (failover order)
  pools:
    - url: stratum+tcp://pool1.example.com:3333
      user: YOUR_WALLET_ADDRESS.worker1
      password: ${POOL_PASSWORD}
      priority: 1
      enabled: true
    
    - url: stratum+tcp://pool2.example.com:3333
      user: YOUR_WALLET_ADDRESS.worker1
      password: ${POOL_PASSWORD}
      priority: 2
      enabled: true
    
    - url: stratum+tcp://backup.pool.com:3333
      user: YOUR_WALLET_ADDRESS.worker1
      password: ${POOL_PASSWORD}
      priority: 3
      enabled: false  # Backup pool
  
  # Connection settings
  max_retries: 5
  retry_delay: 5        # Seconds
  keepalive: 30         # Seconds
  timeout: 10           # Seconds
  extranonce_size: 4

# P2P Network Configuration
p2p:
  enable: true
  port: 18555
  external_port: 18555  # Port for NAT forwarding
  
  # Network settings
  max_peers: 100
  min_peers: 10
  peer_exchange: true
  enable_discovery: true
  
  # Bootstrap nodes
  bootstrap_nodes:
    - "p2p://node1.otedama.network:18555"
    - "p2p://node2.otedama.network:18555"
    - "p2p://node3.otedama.network:18555"
  
  # Network optimization
  enable_upnp: true
  enable_nat_pmp: true
  enable_relay: true
  
  # Bandwidth limits
  max_upload_bandwidth: 0      # KB/s, 0 = unlimited
  max_download_bandwidth: 0    # KB/s, 0 = unlimited

# API Configuration
api:
  enable: true
  address: "0.0.0.0:8080"
  
  # CORS settings
  cors:
    enabled: true
    origins: ["*"]
    credentials: true
    max_age: 3600
  
  # Authentication
  auth:
    enabled: true
    jwt_secret: "${JWT_SECRET}"  # Set via environment variable
    token_expiry: 24h
    refresh_token_expiry: 168h   # 7 days
    require_mfa: false
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
    
    # Per-endpoint limits
    endpoints:
      - path: "/api/v1/mining/start"
        requests_per_minute: 10
      - path: "/api/v1/mining/stop"
        requests_per_minute: 10
  
  # WebSocket
  websocket:
    enabled: true
    ping_interval: 30
    pong_timeout: 60
    max_message_size: 1048576  # 1MB

# Security Configuration
security:
  # Encryption
  rsa_key_size: 4096
  aes_key_size: 256
  rotate_keys_every: 86400  # Seconds (24 hours)
  
  # Authentication
  min_password_length: 12
  require_strong_password: true
  password_history: 5
  max_login_attempts: 5
  lockout_duration: 900  # Seconds (15 minutes)
  session_timeout: 3600  # Seconds (1 hour)
  max_sessions: 10
  
  # DDoS Protection
  max_connections_per_ip: 10
  ban_threshold: 100
  ban_duration: 3600  # Seconds (1 hour)
  
  # IP filtering
  allowed_ips: []      # Empty = allow all
  blocked_ips: []      # IPs to block
  allowed_countries: []  # Empty = allow all
  blocked_countries: []  # Country codes to block
  
  # TLS
  tls:
    enabled: true
    cert_file: "/etc/otedama/tls/cert.pem"
    key_file: "/etc/otedama/tls/key.pem"
    min_version: "1.3"
    cipher_suites:
      - TLS_AES_128_GCM_SHA256
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256

# Monitoring Configuration
monitoring:
  enable: true
  metrics_port: 9090
  health_port: 8081
  
  # Prometheus metrics
  prometheus:
    enabled: true
    namespace: otedama
    subsystem: mining
  
  # Health checks
  health:
    liveness_path: "/health/live"
    readiness_path: "/health/ready"
    startup_path: "/health/startup"
  
  # Alerting
  alerting:
    enabled: true
    
    # Alert channels
    channels:
      - type: webhook
        url: "${ALERT_WEBHOOK_URL}"
        enabled: true
      
      - type: email
        smtp_host: smtp.gmail.com
        smtp_port: 587
        from: alerts@otedama.local
        to: ["admin@example.com"]
        enabled: false
    
    # Alert rules
    rules:
      - name: high_temperature
        condition: temperature > 85
        severity: critical
        message: "Temperature exceeds 85°C"
      
      - name: low_hashrate
        condition: hashrate < 1000000
        severity: warning
        message: "Hashrate below expected"
      
      - name: high_reject_rate
        condition: reject_rate > 0.05
        severity: warning
        message: "Reject rate above 5%"

# Logging Configuration
logging:
  level: info  # debug, info, warn, error
  output: both  # stdout, file, both
  
  # File logging
  file:
    enabled: true
    path: "/var/log/otedama/otedama.log"
    max_size: 100        # MB
    max_backups: 10
    max_age: 30          # Days
    compress: true
  
  # Structured logging
  format: json  # text, json
  
  # Log sampling
  sampling:
    enabled: true
    initial: 100
    thereafter: 100

# Database Configuration
database:
  type: sqlite  # sqlite, postgres, mysql
  
  # SQLite settings
  sqlite:
    path: "/var/lib/otedama/otedama.db"
    wal_mode: true
    foreign_keys: true
  
  # PostgreSQL settings (if type=postgres)
  postgres:
    host: localhost
    port: 5432
    database: otedama
    username: otedama
    password: "${DB_PASSWORD}"
    ssl_mode: require
    max_connections: 100
    max_idle_connections: 10
    connection_max_lifetime: 3600

# Backup Configuration
backup:
  enabled: true
  interval: 86400  # Seconds (24 hours)
  
  # Backup destinations
  destinations:
    - type: local
      path: "/backup/otedama"
      retention_days: 30
      enabled: true
    
    - type: s3
      bucket: otedama-backups
      region: us-east-1
      access_key: "${AWS_ACCESS_KEY}"
      secret_key: "${AWS_SECRET_KEY}"
      retention_days: 90
      enabled: false

# Update Configuration
update:
  auto_update: false
  check_interval: 86400  # Seconds (24 hours)
  update_channel: stable  # stable, beta, nightly
  
  # Update server
  server:
    url: "https://updates.otedama.network"
    public_key: "${UPDATE_PUBLIC_KEY}"

# Performance Tuning
performance:
  # Memory limits
  memory_limit: 4294967296  # 4GB in bytes
  gc_percent: 100
  
  # Thread pool
  worker_threads: 0  # 0 = auto
  task_queue_size: 1000
  
  # Caching
  cache_size: 268435456  # 256MB in bytes
  cache_ttl: 3600        # Seconds
  
  # Batching
  batch_size: 100
  batch_timeout: 1000  # Milliseconds

# Advanced Settings
advanced:
  # Profiling
  profiling:
    enabled: false
    cpu_profile: "/tmp/otedama-cpu.prof"
    memory_profile: "/tmp/otedama-mem.prof"
    block_profile: "/tmp/otedama-block.prof"
  
  # Debug
  debug:
    enabled: false
    pprof_enabled: false
    pprof_address: "localhost:6060"
  
  # Experimental features
  experimental:
    enable_wasm: false
    enable_gpu_compute: false
    enable_fpga: false
    enable_quantum_resistance: false

# Environment-specific overrides
environments:
  development:
    logging:
      level: debug
    security:
      auth:
        enabled: false
    monitoring:
      alerting:
        enabled: false
  
  staging:
    logging:
      level: info
    api:
      rate_limit:
        requests_per_minute: 100
  
  production:
    logging:
      level: warn
    security:
      auth:
        require_mfa: true
    backup:
      enabled: true