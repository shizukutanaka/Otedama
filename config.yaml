# Otedama P2P Mining Pool Configuration
# Version: 2.1.9
# Default configuration file - copy to config.yaml and edit

# Mining configuration
mining:
  algorithm: sha256d              # Mining algorithm (sha256d, scrypt, ethash, randomx, cryptonight, x11, blake2b)
  auto_start: false              # Start mining on application launch
  auto_select: false             # Auto-select most profitable algorithm
  
  # CPU mining settings
  cpu:
    enabled: true                # Enable CPU mining
    threads: 0                   # Number of threads (0 = auto-detect)
    affinity: []                 # CPU affinity (empty = auto)
    priority: normal             # Process priority (low, normal, high, realtime)
    huge_pages: false            # Enable huge pages
  
  # GPU mining settings
  gpu:
    enabled: false               # Enable GPU mining
    devices: []                  # GPU devices to use (empty = all)
    intensity: 20                # Mining intensity (1-30)
    temperature_limit: 85        # Temperature limit in Celsius
    power_limit: 0               # Power limit in watts (0 = no limit)
    memory_clock: 0              # Memory clock in MHz (0 = default)
    core_clock: 0                # Core clock in MHz (0 = default)
  
  # ASIC mining settings
  asic:
    enabled: false               # Enable ASIC mining
    devices: []                  # ASIC devices (serial ports)
    frequency: 650               # Frequency in MHz
  
  # Optimization settings
  optimization:
    power_mode: balanced         # Power mode (efficiency, balanced, performance, turbo)
    auto_tuning: true           # Enable auto-tuning
    tuning_interval: 300        # Auto-tuning interval in seconds
    target_efficiency: 0.95     # Target efficiency (0.0-1.0)

# Stratum pool configuration
stratum:
  enabled: true                  # Enable stratum protocol
  version: 1                     # Stratum version (1 or 2)
  max_retries: 5                 # Maximum reconnection retries
  retry_delay: 5                 # Retry delay in seconds
  keepalive: 30                  # Keepalive interval in seconds
  timeout: 10                    # Connection timeout in seconds
  extranonce_size: 4            # Extra nonce size
  
  # Mining pools (in priority order)
  pools:
    # Primary pool
    - url: stratum+tcp://pool.example.com:3333
      user: YOUR_WALLET_ADDRESS.worker1
      password: ${POOL_PASSWORD:-secure_password_here}
      priority: 1
      enabled: true
    
    # Backup pool
    - url: stratum+tcp://backup.pool.com:3333
      user: YOUR_WALLET_ADDRESS.worker1
      password: ${POOL_PASSWORD:-secure_password_here}
      priority: 2
      enabled: false

# P2P network configuration
p2p:
  enable: false                  # Enable P2P networking
  port: 18555                    # P2P port
  external_port: 18555          # External port (for NAT)
  max_peers: 100                # Maximum number of peers
  min_peers: 10                 # Minimum number of peers
  peer_exchange: true           # Enable peer exchange
  enable_discovery: true        # Enable peer discovery
  enable_upnp: true             # Enable UPnP port mapping
  enable_nat_pmp: true          # Enable NAT-PMP
  enable_relay: false           # Enable relay mode
  max_upload_bandwidth: 0       # Max upload bandwidth in KB/s (0 = unlimited)
  max_download_bandwidth: 0     # Max download bandwidth in KB/s (0 = unlimited)
  
  # Bootstrap nodes
  bootstrap_nodes: []
    # - "p2p://node1.otedama.network:18555"
    # - "p2p://node2.otedama.network:18555"

# API server configuration
api:
  enable: true                   # Enable API server
  address: ":8080"              # API listen address
  
  # CORS settings
  cors:
    enabled: true
    origins: ["*"]
    credentials: false
    max_age: 3600
  
  # Authentication settings
  auth:
    enabled: false               # Enable authentication
    jwt_secret: ""              # JWT secret (auto-generated if empty)
    token_expiry: 24h           # Token expiry duration
    refresh_token_expiry: 168h  # Refresh token expiry (7 days)
    require_mfa: false          # Require multi-factor authentication
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  
  # WebSocket settings
  websocket:
    enabled: true
    ping_interval: 30
    pong_timeout: 60
    max_message_size: 1048576   # 1MB

# Security configuration
security:
  # Encryption settings
  rsa_key_size: 2048            # RSA key size
  aes_key_size: 256             # AES key size
  rotate_keys_every: 86400      # Key rotation interval in seconds
  
  # Password policy
  min_password_length: 8
  require_strong_password: true
  password_history: 3
  max_login_attempts: 5
  lockout_duration: 900         # 15 minutes
  
  # Session settings
  session_timeout: 3600         # 1 hour
  max_sessions: 10
  
  # DDoS protection
  max_connections_per_ip: 10
  ban_threshold: 100
  ban_duration: 3600            # 1 hour
  
  # IP filtering
  allowed_ips: []               # Empty = allow all
  blocked_ips: []               # IPs to block
  
  # TLS settings
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    min_version: "1.2"

# Monitoring configuration
monitoring:
  enable: true                  # Enable monitoring
  metrics_port: 9090            # Prometheus metrics port
  health_port: 8081             # Health check port
  
  # Prometheus settings
  prometheus:
    enabled: true
    namespace: otedama
    subsystem: mining
  
  # Health check endpoints
  health:
    liveness_path: "/health/live"
    readiness_path: "/health/ready"
    startup_path: "/health/startup"
  
  # Alerting configuration
  alerting:
    enabled: false
    
    # Alert channels
    channels: []
      # - type: webhook
      #   url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
      #   enabled: true
    
    # Alert rules
    rules:
      - name: high_temperature
        condition: temperature > 85
        severity: critical
        message: "Temperature exceeds 85°C"
      
      - name: low_hashrate
        condition: hashrate < 1000000
        severity: warning
        message: "Hashrate below expected"

# Logging configuration
logging:
  level: info                   # Log level (debug, info, warn, error)
  output: both                  # Output (stdout, file, both)
  
  # File logging
  file:
    enabled: true
    path: "logs/otedama.log"
    max_size: 100               # Max file size in MB
    max_backups: 10             # Max number of backups
    max_age: 30                 # Max age in days
    compress: true              # Compress old logs
  
  # Log format
  format: json                  # Format (text, json)
  
  # Sampling
  sampling:
    enabled: false
    initial: 100
    thereafter: 100

# Database configuration
database:
  type: sqlite                  # Database type (sqlite, postgres, mysql)
  
  # SQLite settings
  sqlite:
    path: "data/otedama.db"
    wal_mode: true
    foreign_keys: true
  
  # PostgreSQL settings
  postgres:
    host: localhost
    port: 5432
    database: otedama
    username: otedama
    password: ""
    ssl_mode: disable
    max_connections: 100
    max_idle_connections: 10
    connection_max_lifetime: 3600
  
  # MySQL settings
  mysql:
    host: localhost
    port: 3306
    database: otedama
    username: otedama
    password: ""
    max_connections: 100

# Backup configuration
backup:
  enabled: false                # Enable automatic backups
  interval: 86400              # Backup interval in seconds (24 hours)
  retention_days: 30           # Backup retention in days
  
  # Backup destinations
  destinations:
    - type: local
      path: "backups"
      enabled: true

# Update configuration
update:
  auto_update: false           # Enable auto-update
  check_interval: 86400        # Update check interval in seconds
  update_channel: stable       # Update channel (stable, beta, nightly)
  
  # Update server
  server:
    url: "https://updates.otedama.network"
    public_key: ""

# Performance tuning
performance:
  # Memory settings
  memory_limit: 0              # Memory limit in bytes (0 = no limit)
  gc_percent: 100              # Garbage collection percentage
  
  # Thread pool
  worker_threads: 0            # Worker threads (0 = auto)
  task_queue_size: 1000        # Task queue size
  
  # Cache settings
  cache_size: 268435456        # Cache size in bytes (256MB)
  cache_ttl: 3600             # Cache TTL in seconds
  
  # Batch processing
  batch_size: 100
  batch_timeout: 1000         # Batch timeout in milliseconds

# Advanced settings
advanced:
  # Profiling
  profiling:
    enabled: false
    cpu_profile: ""
    memory_profile: ""
    block_profile: ""
  
  # Debug settings
  debug:
    enabled: false
    pprof_enabled: false
    pprof_address: "localhost:6060"
  
  # Experimental features
  experimental:
    enable_wasm: false
    enable_gpu_compute: false
    enable_fpga: false