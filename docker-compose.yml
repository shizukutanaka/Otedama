# Otedama P2P Mining Pool v2.1.9
version: '3.8'

services:
  otedama:
    build:
      context: .
      dockerfile: Dockerfile
    image: otedama:v2.1.9
    container_name: otedama
    restart: unless-stopped
    
    # Environment variables
    env_file:
      - .env
    
    # Ports
    ports:
      - "8080:8080"     # API
      - "8443:8443"     # SSL API
      - "9090:9090"     # Metrics
      - "8081:8081"     # Health
      - "18555:18555"   # P2P
    
    # Volumes
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Networks
    networks:
      - otedama-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: otedama-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - otedama-network
    depends_on:
      - otedama

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: otedama-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - otedama-network
    depends_on:
      - prometheus

  # Optional: PostgreSQL database (instead of SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: otedama-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: otedama
  #     POSTGRES_USER: otedama
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - otedama-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U otedama"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: otedama-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - otedama-network
  #   command: redis-server --appendonly yes

# Networks
networks:
  otedama-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  redis-data:
