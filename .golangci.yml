# golangci-lint configuration for Otedama.
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  # Don't waste CPU analysing generated or vendored code.
  skip-dirs:
    - vendor
    - dist
    - bin
  # Go toolchain version.
  go: "1.22"

# Output format.
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

# Linters enabled by default in golangci-lint + additional curated set.
linters:
  disable-all: true
  enable:
    # Essential — catches real bugs.
    - errcheck         # unchecked errors
    - govet            # Go's own static analyser
    - ineffassign      # unused assignments
    - staticcheck      # multi-purpose static analyser
    - unused           # unused code
    - typecheck        # compilation check

    # Security.
    - gosec            # security scanner
    - bodyclose        # forgotten Body.Close on HTTP responses
    - rowserrcheck     # forgotten sql.Rows.Err()

    # Code quality.
    - goconst          # repeated strings → constants
    - gocritic         # opinionated but valuable
    - revive           # golint successor
    - unconvert        # unnecessary type conversions
    - unparam          # unused function parameters
    - dogsled          # excessive blank identifiers
    - dupl             # duplicate code
    - gocyclo          # cyclomatic complexity
    - misspell         # catches typos
    - nakedret         # naked returns in long funcs
    - prealloc         # slice capacity hints
    - gosimple         # simplifications

    # Formatting.
    - gofmt
    - gofumpt          # stricter gofmt
    - goimports        # import grouping

    # Error handling.
    - errorlint        # errors.Is/As usage
    - nilerr           # returning nil when error != nil

    # Modernity.
    - usestdlibvars    # use stdlib constants (http.MethodGet etc.)
    - wastedassign     # wasted assignments

# Per-linter configuration.
linters-settings:
  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 4
    min-occurrences: 4

  dupl:
    threshold: 150

  revive:
    severity: warning
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
      - opinionated
    disabled-checks:
      - unnamedResult   # named returns are sometimes clearer
      - whyNoLint       # we prefer succinct disable comments
      - hugeParam       # structs <1KB are idiomatic to pass by value in Go; flagging them is noise

  gofumpt:
    module-path: github.com/shizukutanaka/Otedama
    extra-rules: true

  misspell:
    locale: US

  errorlint:
    errorf: true
    asserts: true
    # comparison: false — sentinel errors (e.g. flag.ErrHelp, io.EOF) are
    # idiomatic to compare with == in stdlib Go; enabling comparison here
    # produces false positives on every sentinel check.
    comparison: false

  gosec:
    excludes:
      # G104 (unchecked error) is caught by errcheck with more context.
      - G104
      # G601 (implicit memory aliasing in for loop) — we've audited
      # every loop body for correctness.
      - G601
      # G115 (int->uint conversions in bit/byte packing) — all are
      # intentional, range-checked crypto/encoding math (bech32, BIP39
      # seed bits, hash mantissa, stratum frame/msg word packing). Values
      # are always non-negative and within range; suppressing avoids
      # noisy false positives without changing behaviour.
      - G115
      # G306 (WriteFile mode 0644) — systemd unit / launchd plist files
      # MUST be world-readable for the service manager to load them; 0600
      # would break daemon install. False positive for this use case.
      - G306

# Issue filtering.
issues:
  # Show all issues, not just a sample.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Relax rules for test files.
    - path: _test\.go
      linters:
        - errcheck      # tests often ignore Close errors intentionally
        - gosec         # test fixtures use weak RNG by design
        - dupl          # tests are often repetitive by nature
        - goconst       # repeated literals are clearer in tests
        - unparam       # test helpers often have unused returns
        - gocyclo       # long table-driven tests

    # goconst: short CLI literals ("--help", "(default)") read clearer inline
    # than as package-level constants; constantising them hurts readability
    # for no real gain. Relax for the cmd/otedama entrypoint package.
    - path: cmd/otedama/.*\.go
      linters:
        - goconst

    # The CPU worker's main loop is inherently complex.
    - path: internal/miner/worker\.go
      text: "cyclomatic complexity"

    # Version metadata fields are filled by ldflags; they are empty at
    # compile time by design.
    - path: internal/version/version\.go
      linters:
        - goconst

# Severity — which issues block the PR.
severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - gosec
        - staticcheck
        - typecheck
      severity: error
