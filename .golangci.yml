version: "2"
run:
  go: "1.24"
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    dupl:
      threshold: 150
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    goconst:
      min-len: 4
      min-occurrences: 4
    gocritic:
      disabled-checks:
        - unnamedResult
        - whyNoLint
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G601
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - unparam
        path: _test\.go
      - path: internal/miner/worker\.go
        text: cyclomatic complexity
      - linters:
          - goconst
        path: internal/version/version\.go
      - linters:
          - misspell
        path: internal/lightning/english_wordlist\.go
      # The message catalogs are authored in 10 languages; a US-English
      # spell-checker cannot evaluate non-English string literals.
      - linters:
          - misspell
        path: internal/i18n/
    paths:
      - vendor
      - dist
      - bin
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: warning
  rules:
    - linters:
        - errcheck
        - gosec
        - staticcheck
      severity: error
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/shizukutanaka/Otedama
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - vendor
      - dist
      - bin
      - third_party$
      - builtin$
      - examples$
