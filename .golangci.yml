run:
  timeout: 5m
  tests: false
  skip-dirs:
    - vendor
    - test
    - docs
  skip-files:
    - ".*_test\\.go$"

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    - gosimple
    - goconst
    - misspell
    - unconvert
    - prealloc
    - nakedret
  disable:
    - gosec # Security is handled separately
    - gocyclo # Complexity is acceptable for performance
    - dupl # Some duplication is acceptable

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/shizukutanaka/Otedama
  govet:
    check-shadowing: true
  errcheck:
    check-type-assertions: true
    check-blank: false
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
  nakedret:
    max-func-lines: 30

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
    - linters:
        - staticcheck
      text: "SA1019" # Ignore deprecation warnings
  max-issues-per-linter: 50
  max-same-issues: 10
