name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  # One run per tag; never cancel an in-flight release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.23.x'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > changelog.txt
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat changelog.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          See the [deployment guide](https://github.com/${{ github.repository }}/blob/master/docs/DEPLOYMENT.md) for installation instructions.
        draft: false
        prerelease: false

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    needs: create-release
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
          - os: linux
            arch: arm64
            suffix: ""
          - os: darwin
            arch: amd64
            suffix: ""
          - os: darwin
            arch: arm64
            suffix: ""
          - os: windows
            arch: amd64
            suffix: ".exe"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        LDFLAGS="-s -w -X github.com/shizukutanaka/Otedama/internal/version.Version=${GITHUB_REF#refs/tags/} -X github.com/shizukutanaka/Otedama/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/shizukutanaka/Otedama/internal/version.Commit=$GITHUB_SHA"
        go build -ldflags "$LDFLAGS" -o otedama-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} ./cmd/otedama
        tar czf otedama-${{ matrix.os }}-${{ matrix.arch }}.tar.gz otedama-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} README.md LICENSE

    - name: Generate checksum
      run: sha256sum "otedama-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "otedama-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256"

    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.ref_name }}" "otedama-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" --clobber

    - name: Upload Release Checksum
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.ref_name }}" "otedama-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256" --clobber

  build-packages:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    needs: create-release
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm ruby ruby-dev build-essential
        sudo gem install fpm -v 1.18.0

    - name: Build Linux binary
      env:
        CGO_ENABLED: 0
      run: |
        VERSION=${{ needs.create-release.outputs.version }}
        go build -ldflags "-s -w" -o otedama ./cmd/otedama

    - name: Create DEB package
      run: |
        VERSION=${{ needs.create-release.outputs.version }}
        fpm -s dir -t deb \
          -n otedama \
          -v "${VERSION#v}" \
          --description "Otedama - P2P Mining Pool Software" \
          --url "https://github.com/shizukutanaka/Otedama" \
          --maintainer "Otedama Project" \
          --license "MIT" \
          --vendor "Otedama Project" \
          ./otedama=/usr/bin/otedama \
          ./config.yaml.example=/etc/otedama/config.yaml

    - name: Create RPM package
      run: |
        VERSION=${{ needs.create-release.outputs.version }}
        fpm -s dir -t rpm \
          -n otedama \
          -v "${VERSION#v}" \
          --description "Otedama - P2P Mining Pool Software" \
          --url "https://github.com/shizukutanaka/Otedama" \
          --maintainer "Otedama Project" \
          --license "MIT" \
          --vendor "Otedama Project" \
          ./otedama=/usr/bin/otedama \
          ./config.yaml.example=/etc/otedama/config.yaml

    - name: Upload DEB package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=${{ needs.create-release.outputs.version }}
        gh release upload "${{ github.ref_name }}" "otedama_${VERSION#v}_amd64.deb" --clobber

    - name: Upload RPM package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=${{ needs.create-release.outputs.version }}
        gh release upload "${{ github.ref_name }}" "otedama-${VERSION#v}-1.x86_64.rpm" --clobber

  checksums:
    name: Publish combined checksums.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-binaries
    permissions:
      contents: write
    steps:
      # install.sh probes "checksums.txt" first; per-asset .sha256 files
      # alone can't be verified by it. Hash the published assets themselves.
      - name: Build combined checksums file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" -p "otedama-*.tar.gz" -D assets --clobber
          cd assets
          sha256sum otedama-*.tar.gz > checksums.txt
          gh release upload "${{ github.ref_name }}" checksums.txt --clobber

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [create-release, build-binaries]
    if: vars.HOMEBREW_TAP_REPO != ''
    steps:
    - name: Checkout Homebrew tap
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.HOMEBREW_TAP_REPO }}
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    - name: Update Homebrew formula
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: .
        commit-message: Update Otedama to ${{ needs.create-release.outputs.version }}
        title: Update Otedama to ${{ needs.create-release.outputs.version }}
        body: |
          Automated update of Otedama formula to version ${{ needs.create-release.outputs.version }}
          
          Release notes: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}
        branch: update-${{ needs.create-release.outputs.version }}