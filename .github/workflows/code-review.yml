name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Check for common issues
  common-issues:
    name: Check Common Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check for TODO comments
        run: |
          # Go TODO/FIXME census — mirrors Makefile audit check [6].
          # (Secrets are covered by trufflehog in security.yml; the previous
          #  JS-only secret/console greps were vacuous — this repo ships no .js/.json.)
          echo "### TODO Comments" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -rn "TODO\|FIXME\|HACK" --include="*.go" . >> $GITHUB_STEP_SUMMARY || echo "No TODO comments found" >> $GITHUB_STEP_SUMMARY

  # Dependency review
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          
