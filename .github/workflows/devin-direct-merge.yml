name: Trigger Devin Via Comment

on:
  pull_request:
    types: [synchronize, opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-conflict-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # コンフリクト状態をチェック
      - name: Check Mergeable Status
        id: check_conflict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub標準のトークン（Devin用ではない）
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          # mergeable は GitHub が非同期計算 — 初回 UNKNOWN を競合なしと誤認しないよう短くリトライ
          STATUS=""
          for i in 1 2 3; do
            STATUS=$(gh pr view $PR_NUM --json mergeable --jq .mergeable)
            [ "$STATUS" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$STATUS" = "CONFLICTING" ]; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          fi

      # コンフリクトがある場合、PRにコメントを投稿してDevinのSessionを起動
      # （フォークPRでは書込トークンが降格してコメント不可のため同一リポのPRのみ）
      - name: Comment to Trigger Devin
        if: steps.check_conflict.outputs.conflict == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "/fix-conflict masterブランチとの競合を git merge で解消し、テストを通してください。"
