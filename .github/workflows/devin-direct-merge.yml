name: Trigger Devin Via Comment

on:
  pull_request:
    types: [synchronize, opened]

jobs:
  check-conflict-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # コンフリクト状態をチェック
      - name: Check Mergeable Status
        id: check_conflict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub標準のトークン（Devin用ではない）
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          STATUS=$(gh pr view $PR_NUM --json mergeable --jq .mergeable)
          if [ "$STATUS" = "CONFLICTING" ]; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          fi

      # コンフリクトがある場合、PRにコメントを投稿してDevinのSessionを起動
      - name: Comment to Trigger Devin
        if: steps.check_conflict.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "/fix-conflict mainブランチとの競合を git merge で解消し、テストを通してください。"
