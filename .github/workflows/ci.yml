# GitHub Actions CI/CD Pipeline for Otedama
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly builds
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'
  DOCKER_REGISTRY: ghcr.io
  # GHCR repository names must be lowercase. github.repository keeps the
  # repo's capitalisation ("shizukutanaka/Otedama"); docker/metadata-action
  # lowercases the names it generates, but the direct tags in the docker
  # jobs below do not pass through it and fail to push as-is.
  IMAGE_NAME: shizukutanaka/otedama
  GIT_TERMINAL_PROMPT: 0
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: local

jobs:
  # Lint and format check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
            
      # Installed via the action, not the install.sh script: the
      # script's checksum lookup matches the release's new
      # .tar.gz.sbom.json entry as well as the tarball itself and
      # aborts the install for v2.15.0.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --timeout=5m
        
      - name: Check go fmt
        run: |
          fmt_files=$(gofmt -l .)
          if [ -n "$fmt_files" ]; then
            echo "The following files need formatting:"
            echo "$fmt_files"
            exit 1
          fi
          
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # upload-sarif needs security-events: write; without it the Trivy
    # upload step fails with "Resource not accessible by integration"
    # (the workflow-level permissions only grant contents: read).
    # security.yml declares the same grant at the top level.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Run gosec security scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          # Mirrors security.yml, this repo's canonical security gate:
          # without the severity floor the step fails on every medium/low
          # finding (G301/G304/G104 in the current tree) while the
          # dedicated security workflow passes on the same code.
          args: '-fmt sarif -out gosec-results.sarif -stdout -verbose=text -severity high ./...'
          
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: 'gosec-results.sarif'

  # Unit tests
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
            
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
        
      - name: Run tests (Windows, CGO disabled)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CGO_ENABLED: 0
        run: go test -v -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
        timeout-minutes: 15

      - name: Run tests (non-Windows, with race)
        if: matrix.os != 'windows-latest'
        run: go test -v -timeout 10m -race -coverprofile=coverage.out -covermode=atomic ./...
        timeout-minutes: 15
        
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: |
          go tool cover -html=coverage.out -o coverage.html
          
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.html

  # Selective tests for changed packages on PRs (C-13)
  test-changed:
    name: Test Changed Packages (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine changed Go packages
        id: pkgs
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=2 origin "${BASE_REF}:${BASE_REF}" || true
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}"...HEAD | grep -E '\\.go$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "pkgs=" >> $GITHUB_OUTPUT
            exit 0
          fi
          DIRS=$(printf '%s\n' $CHANGED_FILES | xargs -r -n1 dirname | sort -u)
          # Map dirs to import paths, ignore errors for non-module paths
          PKGS=$(for d in $DIRS; do go list "./$d" 2>/dev/null || true; done | sort -u)
          echo "Changed packages:" $PKGS
          echo "pkgs=$PKGS" >> $GITHUB_OUTPUT

      - name: Run tests for changed packages
        if: steps.pkgs.outputs.pkgs != ''
        shell: bash
        run: |
          set -euo pipefail
          go test -v -timeout 10m -race ${{ steps.pkgs.outputs.pkgs }}
        timeout-minutes: 10
      - name: Skip (no Go changes)
        if: steps.pkgs.outputs.pkgs == ''
        run: echo "No Go package changes detected; skipping selective tests."

  # Benchmark tests
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run benchmarks
        run: go test -run=XXX -bench=. -benchmem ./... | tee benchmark.txt
        timeout-minutes: 20
        
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark.txt

  # Build binaries
  build:
    name: Build
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 1
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: 1
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      # The linux/arm64 legs build with CGO_ENABLED=1 on an amd64 runner;
      # with only the host gcc the build dies assembling runtime/cgo's
      # arm64 sources. Provide the cross compiler and point CC at it.
      - name: Install arm64 cross C compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          output_name=otedama-${GOOS}-${GOARCH}
          if [ "${GOOS}" = "windows" ]; then
            output_name=${output_name}.exe
          fi
          # Build the whole package — cmd/otedama is 10 files; naming
          # main.go alone fails with undefined references.
          go build -ldflags="-s -w -X github.com/shizukutanaka/Otedama/internal/version.Version=${REF_NAME} -X github.com/shizukutanaka/Otedama/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/shizukutanaka/Otedama/internal/version.Commit=${COMMIT_SHA}" -o ${output_name} ./cmd/otedama
          
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otedama-${{ matrix.goos }}-${{ matrix.goarch }}
          path: otedama-*

  # Build binaries with unified features enabled (experimental_unified)
  build-unified:
    name: Build (Unified)
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 1
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: 1
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      # See the build job: linux/arm64 + CGO needs the cross compiler.
      - name: Install arm64 cross C compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binary (unified)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          output_name=otedama-${GOOS}-${GOARCH}-unified
          if [ "${GOOS}" = "windows" ]; then
            output_name=${output_name}.exe
          fi
          go build -tags=experimental_unified -ldflags="-s -w -X github.com/shizukutanaka/Otedama/internal/version.Version=${REF_NAME} -X github.com/shizukutanaka/Otedama/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/shizukutanaka/Otedama/internal/version.Commit=${COMMIT_SHA}" -o ${output_name} ./cmd/otedama
      
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otedama-${{ matrix.goos }}-${{ matrix.goarch }}-unified
          path: otedama-*-unified*

  # Build Docker image
  docker:
    name: Docker Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      # Sentinel for the optional Docker Hub login below: a step's `if`
      # cannot read secrets directly, so the username is mirrored here.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Build (local load) Docker image for verification (CGO=1)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: otedama:ci-test
        timeout-minutes: 10
      
      - name: Verify container runs and prints version (CGO=1)
        run: |
          set -euo pipefail
          OUT=$(docker run --rm otedama:ci-test version || true)
          echo "$OUT"
          echo "$OUT" | grep -q "(${{ github.sha }})" || (echo "Git commit not embedded in version output" && exit 1)
        timeout-minutes: 5
      
      - name: Build (local load) Docker image for verification (CGO=0)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: otedama:ci-test-cgo0
        timeout-minutes: 10
      
      - name: Verify container runs and prints version (CGO=0)
        run: |
          set -euo pipefail
          OUT=$(docker run --rm otedama:ci-test-cgo0 version || true)
          echo "$OUT"
          echo "$OUT" | grep -q "(${{ github.sha }})" || (echo "Git commit not embedded in version output (cgo0)" && exit 1)
        timeout-minutes: 5
        
      # No image in this workflow is tagged for Docker Hub (every tag
      # targets GHCR); this login only lifts Docker Hub pull rate limits
      # when credentials happen to be configured. With no secrets set it
      # fails with "Username and password required" on every push, so it
      # runs only when the username secret exists.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (CGO=0)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-cgo0
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cgo0
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Verify Docker container health (CGO=1)
  docker-verify:
    name: Docker Verify (Health)
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for verification (local load)
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg COMMIT=${{ github.sha }} \
            -t "$IMAGE_TAG" .

      - name: Validate version output includes commit
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-${{ github.sha }}
        run: |
          set -euo pipefail
          OUT=$(docker run --rm "$IMAGE_TAG" version || true)
          echo "$OUT"
          echo "$OUT" | grep -q "(${{ github.sha }})" || (echo "Git commit not embedded in version output (verify job)" && exit 1)

      - name: Run hardened container and verify health (read-only, drop caps)
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-${{ github.sha }}
          HEALTH_URL: http://localhost:8082/healthz
        run: |
          set -euo pipefail
          CONTAINER=otedama-verify-hardened
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" --network host \
            --read-only --cap-drop=ALL --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "$IMAGE_TAG" run --data-dir /tmp/otedama --bitcoin-address bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4 --http-addr 127.0.0.1:8082 >/dev/null
          for i in {1..60}; do
            if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Health check OK (hardened)"; break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then echo "Hardened health check did not become ready in time"; docker logs --tail 200 "$CONTAINER" || true; exit 1; fi
          done
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

  # Verify CGO=0 image (Ubuntu)
  docker-verify-cgo0-postgres:
    name: Docker Verify (CGO=0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build CGO=0 image for verification (local load)
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-cgo0-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg COMMIT=${{ github.sha }} \
            -t "$IMAGE_TAG" .

      - name: Validate version output includes commit (CGO=0)
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-cgo0-${{ github.sha }}
        run: |
          set -euo pipefail
          OUT=$(docker run --rm "$IMAGE_TAG" version || true)
          echo "$OUT"
          echo "$OUT" | grep -q "(${{ github.sha }})" || (echo "Git commit not embedded in version output (cgo0-postgres verify)" && exit 1)

      - name: Start container and verify health (CGO=0 + Postgres)
        id: run_cgo0
        shell: bash
        env:
          IMAGE_TAG: otedama:ci-verify-cgo0-${{ github.sha }}
          HEALTH_URL: http://localhost:8082/healthz
        run: |
          set -euo pipefail
          CONTAINER=otedama-verify-cgo0
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" --network host \
            "$IMAGE_TAG" run --data-dir /tmp/otedama --bitcoin-address bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4 --http-addr 127.0.0.1:8082 >/dev/null

          # Poll health
          for i in {1..90}; do
            if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Health check OK"; break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then echo "Health check did not become ready in time"; docker logs --tail 200 "$CONTAINER" || true; exit 1; fi
          done
          # Cleanup on success
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-verify-cgo0-postgres-logs
          path: |
            /var/lib/docker/containers/**/*.log
          if-no-files-found: ignore

  # Build Docker image with unified features enabled
  docker-unified:
    name: Docker Build (Unified)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      # Sentinel for the optional Docker Hub login below (see docker job).
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      # See the docker job: run only when Docker Hub credentials exist.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
      
      - name: Build and push Docker image (unified)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: |
            GOTAGS=-tags=experimental_unified
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-unified
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-unified
          labels: ${{ steps.meta.outputs.labels }}

  # Release
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-unified, docker, docker-unified, docker-verify, docker-verify-cgo0-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # git describe --tags needs full history for the release notes.
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./artifacts
          
      - name: Create release archives
        run: |
          cd artifacts
          # Only binary artifacts — coverage/benchmark dirs must not ship.
          # Flatten the archive (binary at top level) so install.sh can use it.
          for dir in otedama-*/; do
            tar czf "${dir%/}.tar.gz" -C "$dir" .
          done

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum otedama-*.tar.gz > checksums.txt
          
      - name: Generate release notes
        id: release_notes
        run: |
          echo "## What's Changed" > RELEASE_NOTES.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
