name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  # Serializes same-ref deploys without canceling an in-flight release.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Set build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      
      - name: Log in to Container Registry
        # Pull requests get a build-only check: a fork's GITHUB_TOKEN is
        # read-only regardless of job permissions, so a push would fail.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push/tag events publish; pull_request builds validate the
          # Dockerfile without touching the registry (fork-safe).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}

  security-scan:
    # Scans the pushed image digest; there is nothing to scan on a
    # pull_request (no push), so it and the whole deploy chain skip there.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Resolve lowercase image reference
        # docker/metadata-action lowercases the pushed name; raw env.IMAGE_NAME
        # contains "Otedama" and is not a valid docker reference.
        run: echo "IMAGE_REF=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')@${{ needs.build.outputs.image-digest }}" >> $GITHUB_ENV
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      
      - name: Deploy to staging
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          helm upgrade --install otedama-staging ./kubernetes/helm/otedama \
            --namespace otedama-staging \
            --create-namespace \
            --values ./kubernetes/helm/otedama/values.yaml \
            --values ./kubernetes/helm/otedama/values-staging.yaml \
            --set image.tag="${{ needs.build.outputs.image-tag }}" \
            --set image.digest="${{ needs.build.outputs.image-digest }}" \
            --wait \
            --timeout 10m
      
      - name: Run smoke tests
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=otedama -n otedama-staging --timeout=300s
          kubectl run smoke-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://otedama-staging-api:8080/healthz

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    # deploy-staging is intentionally not in needs: its if-gate is false on
    # every tag push and production dispatch, so needing it skipped production
    # unconditionally. Staging-then-prod ordering is already enforced by the
    # environment choice gate, not by job dependency.
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      
      - name: Create backup
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          kubectl create job backup-$(date +%Y%m%d-%H%M%S) \
            --from=cronjob/otedama-backup \
            -n otedama
      
      - name: Deploy to production
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          helm upgrade --install otedama ./kubernetes/helm/otedama \
            --namespace otedama \
            --create-namespace \
            --values ./kubernetes/helm/otedama/values.yaml \
            --values ./kubernetes/helm/otedama/values-production.yaml \
            --set image.tag="${{ needs.build.outputs.image-tag }}" \
            --set image.digest="${{ needs.build.outputs.image-digest }}" \
            --set-string podAnnotations."kubernetes\.io/change-cause"="Deployment ${{ github.ref_name }} by ${{ github.actor }}" \
            --atomic \
            --timeout 15m
      
      - name: Verify deployment
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          kubectl rollout status deployment/otedama -n otedama
          kubectl get pods -n otedama
          kubectl run verify-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://otedama-api:8080/healthz
      
      # No "create release" step here: release.yml owns GitHub release
      # creation on v* tags (softprops/action-gh-release upsert). This job's
      # former actions/create-release@v1 step raced it — and the action is
      # archived besides.

  rollback:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config

      - name: Rollback deployment
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        if: ${{ env.KUBECONFIG_B64 != '' }}
        run: |
          kubectl rollout undo deployment/otedama -n otedama
          kubectl rollout status deployment/otedama -n otedama

      - name: Notify rollback
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "Production deployment rolled back",
              attachments: [{
                color: "danger",
                text: "Deployment of ${{ github.ref_name }} failed and was rolled back"
              }]
            }