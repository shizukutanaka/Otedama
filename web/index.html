<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otedama - Mining Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151932;
            --bg-card: #1e2139;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --accent: #00d4ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --border: #2a2e48;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success));
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 50px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.online { background: var(--success); }
        .status-indicator.offline { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.2);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .stat-change {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat-change.positive { color: var(--success); }
        .stat-change.negative { color: var(--danger); }

        .control-panel {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .workers-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .worker-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .worker-card {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
            border: 1px solid var(--border);
        }

        .worker-card:hover {
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.1);
        }

        .worker-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .worker-icon.cpu { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .worker-icon.gpu { background: linear-gradient(135deg, #10b981, #059669); }
        .worker-icon.asic { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .worker-details h3 {
            font-size: 1.125rem;
            margin-bottom: 5px;
        }

        .worker-stats {
            display: flex;
            gap: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .worker-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-secondary);
            transition: 0.4s;
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--accent), var(--success));
        }

        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }

        .chart-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .chart {
            height: 300px;
            background: var(--bg-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .stat-value { font-size: 1.5rem; }
            .control-grid { grid-template-columns: 1fr; }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Otedama</h1>
                <div class="status-badge">
                    <span class="status-indicator online" id="status-indicator"></span>
                    <span id="status-text">Online</span>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Hashrate</div>
                <div class="stat-value" id="hashrate">0 H/s</div>
                <div class="stat-change positive">+12.5%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Shares</div>
                <div class="stat-value" id="shares">0</div>
                <div class="stat-change" id="shares-rate">0 shares/min</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Temperature</div>
                <div class="stat-value" id="temperature">0°C</div>
                <div class="stat-change">Normal</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Power Usage</div>
                <div class="stat-value" id="power">0W</div>
                <div class="stat-change" id="efficiency">0 H/W</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value" id="uptime">0h 0m</div>
                <div class="stat-change">Since startup</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Workers</div>
                <div class="stat-value" id="workers">0</div>
                <div class="stat-change">All systems go</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-header">
                <h2>Mining Control</h2>
                <span id="mining-status">Status: Idle</span>
            </div>
            <div class="control-grid">
                <button class="btn btn-primary" id="start-btn" onclick="startMining()">
                    Start Mining
                </button>
                <button class="btn btn-danger" id="stop-btn" onclick="stopMining()" disabled>
                    Stop Mining
                </button>
                <button class="btn btn-secondary" onclick="openSettings()">
                    Settings
                </button>
                <button class="btn btn-secondary" onclick="runBenchmark()">
                    Benchmark
                </button>
                <button class="btn btn-secondary" onclick="refreshStats()">
                    Refresh
                </button>
            </div>
        </div>

        <div class="workers-section">
            <div class="control-header">
                <h2>Workers</h2>
                <button class="btn btn-secondary" onclick="refreshWorkers()">Refresh</button>
            </div>
            <div class="worker-list" id="worker-list">
                <!-- Workers will be populated here -->
            </div>
        </div>

        <div class="chart-container">
            <div class="control-header">
                <h2>Performance Chart</h2>
            </div>
            <div class="chart">
                <canvas id="hashrate-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
            </div>
            <div class="form-group">
                <label for="algorithm">Algorithm</label>
                <select id="algorithm">
                    <option value="sha256d">SHA256d</option>
                    <option value="scrypt">Scrypt</option>
                    <option value="ethash">Ethash</option>
                    <option value="randomx">RandomX</option>
                    <option value="cryptonight">CryptoNight</option>
                    <option value="x11">X11</option>
                    <option value="blake2b">Blake2b</option>
                </select>
            </div>
            <div class="form-group">
                <label for="pool-url">Pool URL</label>
                <input type="text" id="pool-url" placeholder="stratum+tcp://pool.example.com:3333">
            </div>
            <div class="form-group">
                <label for="wallet">Wallet Address</label>
                <input type="text" id="wallet" placeholder="Your wallet address">
            </div>
            <div class="form-group">
                <label for="worker-name">Worker Name</label>
                <input type="text" id="worker-name" placeholder="worker1">
            </div>
            <div class="form-group">
                <label for="intensity">GPU Intensity (1-30)</label>
                <input type="number" id="intensity" min="1" max="30" value="22">
            </div>
            <div class="control-grid">
                <button class="btn btn-primary" onclick="saveSettings()">Save</button>
                <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        let miningActive = false;
        let stats = {
            hashrate: 0,
            shares: 0,
            temperature: 0,
            power: 0,
            uptime: 0,
            workers: 0
        };

        // Initialize WebSocket connection
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.hostname}:8080/ws`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                    updateConnectionStatus(true);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus(false);
                };
                
                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    updateConnectionStatus(false);
                    // Reconnect after 5 seconds
                    setTimeout(initWebSocket, 5000);
                };
            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
                updateConnectionStatus(false);
            }
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'statistics':
                    updateStats(data.stats);
                    break;
                case 'mining_status':
                    updateMiningStatus(data.running);
                    break;
                case 'workers':
                    updateWorkers(data.workers);
                    break;
                case 'alert':
                    showAlert(data.message);
                    break;
            }
        }

        // Update connection status
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            
            if (connected) {
                indicator.className = 'status-indicator online';
                statusText.textContent = 'Online';
            } else {
                indicator.className = 'status-indicator offline';
                statusText.textContent = 'Offline';
            }
        }

        // Update statistics
        function updateStats(newStats) {
            if (newStats.hashrate !== undefined) {
                stats.hashrate = newStats.hashrate;
                document.getElementById('hashrate').textContent = formatHashrate(stats.hashrate);
            }
            
            if (newStats.shares_accepted !== undefined) {
                stats.shares = newStats.shares_accepted;
                document.getElementById('shares').textContent = stats.shares.toLocaleString();
            }
            
            if (newStats.temperature !== undefined) {
                stats.temperature = newStats.temperature;
                document.getElementById('temperature').textContent = `${stats.temperature.toFixed(1)}°C`;
            }
            
            if (newStats.power_usage !== undefined) {
                stats.power = newStats.power_usage;
                document.getElementById('power').textContent = `${stats.power.toFixed(0)}W`;
                
                // Calculate efficiency
                if (stats.hashrate > 0 && stats.power > 0) {
                    const efficiency = stats.hashrate / stats.power;
                    document.getElementById('efficiency').textContent = `${formatHashrate(efficiency)}/W`;
                }
            }
            
            if (newStats.uptime !== undefined) {
                document.getElementById('uptime').textContent = formatUptime(newStats.uptime);
            }
            
            if (newStats.workers !== undefined) {
                stats.workers = newStats.workers;
                document.getElementById('workers').textContent = stats.workers;
            }
        }

        // Format hashrate
        function formatHashrate(hashrate) {
            const units = ['H/s', 'KH/s', 'MH/s', 'GH/s', 'TH/s', 'PH/s'];
            let unitIndex = 0;
            let value = hashrate;
            
            while (value >= 1000 && unitIndex < units.length - 1) {
                value /= 1000;
                unitIndex++;
            }
            
            return `${value.toFixed(2)} ${units[unitIndex]}`;
        }

        // Format uptime
        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }

        // Start mining
        async function startMining() {
            try {
                const response = await fetch('/api/v1/mining/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    updateMiningStatus(true);
                } else {
                    showAlert('Failed to start mining');
                }
            } catch (error) {
                console.error('Failed to start mining:', error);
                showAlert('Failed to start mining');
            }
        }

        // Stop mining
        async function stopMining() {
            try {
                const response = await fetch('/api/v1/mining/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    updateMiningStatus(false);
                } else {
                    showAlert('Failed to stop mining');
                }
            } catch (error) {
                console.error('Failed to stop mining:', error);
                showAlert('Failed to stop mining');
            }
        }

        // Update mining status
        function updateMiningStatus(running) {
            miningActive = running;
            const statusText = document.getElementById('mining-status');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            
            if (running) {
                statusText.textContent = 'Status: Mining';
                statusText.style.color = 'var(--success)';
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } else {
                statusText.textContent = 'Status: Idle';
                statusText.style.color = 'var(--text-secondary)';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        // Refresh statistics
        async function refreshStats() {
            try {
                const response = await fetch('/api/v1/mining/stats');
                const data = await response.json();
                updateStats(data);
            } catch (error) {
                console.error('Failed to refresh stats:', error);
            }
        }

        // Refresh workers
        async function refreshWorkers() {
            try {
                const response = await fetch('/api/v1/mining/workers');
                const data = await response.json();
                updateWorkers(data.workers);
            } catch (error) {
                console.error('Failed to refresh workers:', error);
            }
        }

        // Update workers list
        function updateWorkers(workers) {
            const workerList = document.getElementById('worker-list');
            
            if (!workers || workers.length === 0) {
                workerList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No workers available</p>';
                return;
            }
            
            workerList.innerHTML = workers.map(worker => `
                <div class="worker-card">
                    <div class="worker-icon ${worker.type.toLowerCase()}">
                        ${getWorkerIcon(worker.type)}
                    </div>
                    <div class="worker-details">
                        <h3>${worker.name || worker.id}</h3>
                        <div class="worker-stats">
                            <span>Hashrate: ${formatHashrate(worker.hashrate || 0)}</span>
                            <span>Temp: ${(worker.temperature || 0).toFixed(1)}°C</span>
                            <span>Power: ${(worker.power || 0).toFixed(0)}W</span>
                        </div>
                    </div>
                    <div class="worker-status">
                        <label class="toggle-switch">
                            <input type="checkbox" ${worker.active ? 'checked' : ''} 
                                   onchange="toggleWorker('${worker.id}', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            `).join('');
        }

        // Get worker icon
        function getWorkerIcon(type) {
            switch (type.toLowerCase()) {
                case 'cpu': return '💻';
                case 'gpu': return '🎮';
                case 'asic': return '⚡';
                default: return '🔧';
            }
        }

        // Toggle worker
        async function toggleWorker(workerId, enabled) {
            // API call to enable/disable worker
            console.log(`Toggle worker ${workerId}: ${enabled}`);
        }

        // Run benchmark
        async function runBenchmark() {
            showAlert('Starting benchmark...');
            // API call to run benchmark
        }

        // Settings modal
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'block';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const settings = {
                algorithm: document.getElementById('algorithm').value,
                pool: document.getElementById('pool-url').value,
                wallet: document.getElementById('wallet').value,
                worker: document.getElementById('worker-name').value,
                intensity: parseInt(document.getElementById('intensity').value)
            };
            
            console.log('Save settings:', settings);
            closeSettings();
            showAlert('Settings saved');
        }

        // Show alert
        function showAlert(message) {
            // Simple alert for now
            console.log('Alert:', message);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
            refreshStats();
            refreshWorkers();
            
            // Refresh stats every 5 seconds
            setInterval(refreshStats, 5000);
        });

        // Close modal on outside click
        window.onclick = (event) => {
            const modal = document.getElementById('settings-modal');
            if (event.target === modal) {
                closeSettings();
            }
        };
    </script>
</body>
</html>
