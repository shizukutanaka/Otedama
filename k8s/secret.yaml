# Kubernetes Secret for Otedama
# NOTE: In production, use sealed-secrets or external secret management
apiVersion: v1
kind: Secret
metadata:
  name: otedama-secrets
  namespace: otedama
  labels:
    app: otedama
type: Opaque
stringData:
  # JWT Secret for API authentication
  jwt-secret: "change-this-to-a-very-long-random-string-in-production"
  
  # Database password (if using external database)
  database-password: "otedama-db-password"
  
  # Pool credentials
  pool-user: "your-wallet-address.worker"
  pool-password: "x"
  
  # Alert webhook URL
  alert-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  
  # Exchange API credentials
  exchange-api-key: "your-exchange-api-key"
  exchange-api-secret: "your-exchange-api-secret"
  
  # TLS certificates (base64 encoded)
  tls-cert: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t
  tls-key: |
    LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t
  tls-ca: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t

---
# Image Pull Secret (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: otedama
  labels:
    app: otedama
type: kubernetes.io/dockerconfigjson
