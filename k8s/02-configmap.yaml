# Otedama Kubernetes Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: otedama-config
  namespace: otedama
  labels:
    app: otedama
data:
  config.yaml: |
    app:
      name: "Otedama"
      mode: "production"
      log_level: "info"
      debug: false
    
    mining:
      algorithm: "sha256d"
      max_devices: 1000
      auto_scale: true
      redundancy: 3
      batch_size: 64
      
      cpu:
        enabled: true
        threads: 0
        priority: "high"
        affinity: []
        
      gpu:
        enabled: true
        devices: []
        intensity: 22
        temperature_limit: 85
        power_limit: 300
        
      asic:
        enabled: false
        devices: []
        poll_interval: 5s
        reconnect_delay: 10s
    
    stratum:
      enable: true
      address: "0.0.0.0:3333"
      max_workers: 10000
      difficulty:
        initial: 8192
        retarget_interval: 60s
        variance_percent: 30
      extra_nonce_size: 4
      
      pools:
        - url: "${POOL_URL}"
          user: "${POOL_USER}"
          password: "${POOL_PASSWORD}"
          priority: 1
    
    p2p:
      enable: true
      port: 18555
      max_peers: 100
      bootstrap_nodes:
        - "otedama-0.otedama-headless.otedama.svc.cluster.local:18555"
        - "otedama-1.otedama-headless.otedama.svc.cluster.local:18555"
        - "otedama-2.otedama-headless.otedama.svc.cluster.local:18555"
      discovery:
        enable: true
        interval: 30s
        dht: true
      sync:
        enable: true
        batch_size: 1000
        timeout: 30s
    
    api:
      enable: true
      address: "0.0.0.0:8080"
      ssl_address: ""
      cors:
        enabled: true
        origins: ["*"]
        max_age: 3600
      auth:
        enabled: true
        jwt_secret: "${JWT_SECRET}"
        token_expiry: 24h
        refresh_token_expiry: 168h
      rate_limit:
        enabled: true
        requests_per_minute: 100
        burst: 200
    
    monitoring:
      metrics:
        enabled: true
        address: "0.0.0.0:9090"
        namespace: "otedama"
        subsystem: "mining"
      health:
        enabled: true
        address: "0.0.0.0:8082"
        check_interval: 10s
        timeout: 5s
      alerts:
        enabled: true
        webhook_url: "${ALERT_WEBHOOK_URL}"
        thresholds:
          hashrate_drop: 10
          temperature_max: 90
          share_reject_rate: 5

    database:
      driver: "postgresql"
      connection_string: "${DATABASE_URL}"
      max_connections: 100
      max_idle_connections: 10
      connection_max_lifetime: 1h
      enable_logging: false
      migration_dir: "./migrations"

  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'otedama'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - otedama
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

---
# Kubernetes Secret for Otedama
apiVersion: v1
kind: Secret
metadata:
  name: otedama-secrets
  namespace: otedama
  labels:
    app: otedama
type: Opaque
stringData:
  # JWT Secret for API authentication
  jwt-secret: "change-this-to-a-very-long-random-string-in-production"
  
  # Database URL
  database-url: "postgresql://otedama:otedama-db-password@postgres-service.otedama.svc.cluster.local:5432/otedama?sslmode=disable"
  
  # Pool credentials
  pool-url: "stratum+tcp://your-pool-url:3333"
  pool-user: "your-wallet-address.worker"
  pool-password: "x"
  
  # Alert webhook URL
  alert-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

---
