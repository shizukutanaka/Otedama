---
# Otedama Main Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otedama
  namespace: otedama
  labels:
    app: otedama
    component: mining
spec:
  replicas: 3
  selector:
    matchLabels:
      app: otedama
      component: mining
  template:
    metadata:
      labels:
        app: otedama
        component: mining
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-redis
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
      - name: otedama
        image: otedama:production
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: api
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 18555
          name: p2p
          protocol: TCP
        - containerPort: 8082
          name: health
          protocol: TCP
        env:
        - name: OTEDAMA_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://otedama:$(DATABASE_PASSWORD)@postgres:5432/otedama?sslmode=require"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: otedama-secrets
              key: database-password
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: otedama-secrets
              key: jwt-secret
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: otedama-secrets
              key: api-key
        volumeMounts:
        - name: config
          mountPath: /config.yaml
          subPath: config.yaml
          readOnly: true
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /live
            port: health
        readinessProbe:
          httpGet:
            path: /ready
            port: health
      volumes:
      - name: config
        configMap:
          name: otedama-config
      - name: data
        persistentVolumeClaim:
          claimName: otedama-data-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: otedama-logs-pvc
      - name: tmp
        emptyDir: {}

---
# Kubernetes Service for Otedama
apiVersion: v1
kind: Service
metadata:
  name: otedama
  namespace: otedama
  labels:
    app: otedama
    component: mining
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: otedama
    component: mining
  ports:
  - name: api
    port: 8080
    targetPort: api
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: p2p
    port: 18555
    targetPort: p2p
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless Service for P2P discovery
apiVersion: v1
kind: Service
metadata:
  name: otedama-headless
  namespace: otedama
  labels:
    app: otedama
    component: mining
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: otedama
    component: mining
  ports:
  - name: p2p
    port: 18555
    targetPort: p2p
    protocol: TCP

---
# Internal Service for health checks
apiVersion: v1
kind: Service
metadata:
  name: otedama-health
  namespace: otedama
  labels:
    app: otedama
    component: health
spec:
  type: ClusterIP
  selector:
    app: otedama
    component: mining
  ports:
  - name: health
    port: 8082
    targetPort: health
    protocol: TCP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: otedama-hpa
  namespace: otedama
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: otedama
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80