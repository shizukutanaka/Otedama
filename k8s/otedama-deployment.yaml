apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otedama-mining
  namespace: otedama
spec:
  serviceName: otedama-service
  replicas: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: otedama
      component: mining
  template:
    metadata:
      labels:
        app: otedama
        component: mining
        version: latest
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - otedama
            topologyKey: kubernetes.io/hostname
      
      initContainers:
      - name: init-config
        image: busybox:1.35
        command: ['sh', '-c', 'cp /config/* /data/']
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      
      containers:
      - name: otedama
        image: otedama/otedama:latest
        imagePullPolicy: Always
        
        ports:
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: stratum
          containerPort: 3333
          protocol: TCP
        - name: p2p
          containerPort: 18555
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: OTEDAMA_MODE
          value: "production"
        - name: OTEDAMA_LOG_LEVEL
          value: "info"
        - name: OTEDAMA_CLUSTER_ENABLED
          value: "true"
        
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
        - name: cache
          mountPath: /cache
        
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      volumes:
      - name: config
        configMap:
          name: otedama-config
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: otedama-service
  namespace: otedama
  labels:
    app: otedama
spec:
  type: LoadBalancer
  selector:
    app: otedama
    component: mining
  ports:
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: stratum
    port: 3333
    targetPort: 3333
    protocol: TCP
  - name: p2p
    port: 18555
    targetPort: 18555
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: otedama-headless
  namespace: otedama
  labels:
    app: otedama
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: otedama
    component: mining
  ports:
  - name: p2p
    port: 18555
    targetPort: 18555
    protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otedama-config
  namespace: otedama
data:
  config.yaml: |
    app:
      name: "Otedama"
      mode: "production"
      cluster:
        enabled: true
        namespace: otedama
        service: otedama-headless
    
    mining:
      algorithm: sha256d
      auto_scale: true
      batch_size: 64
      
    p2p:
      enabled: true
      port: 18555
      discovery:
        enabled: true
        kubernetes: true
      
    monitoring:
      prometheus:
        enabled: true
        port: 9090
      
    security:
      tls:
        enabled: true
        auto_cert: true

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: otedama-hpa
  namespace: otedama
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: otedama-mining
  minReplicas: 3
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: hashrate_per_pod
      target:
        type: AverageValue
        averageValue: "100000000000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otedama-pdb
  namespace: otedama
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: otedama
      component: mining

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otedama-sa
  namespace: otedama

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otedama-role
  namespace: otedama
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otedama-rolebinding
  namespace: otedama
subjects:
- kind: ServiceAccount
  name: otedama-sa
  namespace: otedama
roleRef:
  kind: Role
  name: otedama-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otedama-monitor
  namespace: otedama
  labels:
    app: otedama
spec:
  selector:
    matchLabels:
      app: otedama
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otedama-network-policy
  namespace: otedama
spec:
  podSelector:
    matchLabels:
      app: otedama
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: otedama
    - podSelector:
        matchLabels:
          app: otedama
    ports:
    - protocol: TCP
      port: 18555
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 3333
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector:
        matchLabels:
          app: otedama
    ports:
    - protocol: TCP
      port: 18555