# Kubernetes Service for Otedama
apiVersion: v1
kind: Service
metadata:
  name: otedama
  namespace: otedama
  labels:
    app: otedama
    component: mining
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: otedama
    component: mining
  ports:
  - name: api
    port: 8080
    targetPort: api
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: p2p
    port: 18555
    targetPort: p2p
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless Service for P2P discovery
apiVersion: v1
kind: Service
metadata:
  name: otedama-headless
  namespace: otedama
  labels:
    app: otedama
    component: mining
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: otedama
    component: mining
  ports:
  - name: p2p
    port: 18555
    targetPort: p2p
    protocol: TCP

---
# Internal Service for health checks
apiVersion: v1
kind: Service
metadata:
  name: otedama-health
  namespace: otedama
  labels:
    app: otedama
    component: health
spec:
  type: ClusterIP
  selector:
    app: otedama
    component: mining
  ports:
  - name: health
    port: 8082
    targetPort: health
    protocol: TCP
