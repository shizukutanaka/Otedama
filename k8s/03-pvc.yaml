# PersistentVolumeClaims for Otedama Stack

---
# PVC for Otedama application data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otedama-data-pvc
  namespace: otedama
  labels:
    app: otedama
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
# PVC for Otedama application logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otedama-logs-pvc
  namespace: otedama
  labels:
    app: otedama
    component: logging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

